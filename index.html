<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>البورتفوليو</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #121826;
      --surface-2: #182032;
      --text: #f3f6fb;
      --muted: #a3b1c6;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: radial-gradient(circle at top, #131c31 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 820px;
    }

    .card {
      background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    .badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 800;
      margin-bottom: 16px;
      color: var(--text);
    }

    .statement {
      font-size: clamp(1.05rem, 2.2vw, 1.3rem);
      font-weight: 600;
      color: var(--text);
      background: rgba(11, 15, 23, 0.55);
      border-right: 4px solid var(--accent);
      border-radius: 12px;
      padding: 18px 20px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 24px 18px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <span class="badge">سابقة الأعمال</span>
      <h1>أبرز الإنجازات</h1>
      <p class="statement">تم العمل على موقع المؤسسة العربية المتحدة للنشر العلمي Arusp من الصفر للوصول إلى الصفحة الأولى في العديد من الكلمات البحثية</p>
    </section>
  </main>
</body>
</html>
